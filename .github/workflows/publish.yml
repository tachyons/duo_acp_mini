name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  create-tag-and-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    outputs:
      release-created: ${{ steps.create-release.outputs.release-created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: v${VERSION}"

      - name: Check if tag exists
        id: check-tag
        run: |
          if git rev-parse "refs/tags/${{ steps.get-version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.get-version.outputs.version }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag ${{ steps.get-version.outputs.version }} does not exist"
          fi

      - name: Create tag
        if: steps.check-tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.get-version.outputs.version }} -m "Release ${{ steps.get-version.outputs.version }}"
          git push origin ${{ steps.get-version.outputs.version }}

      - name: Create Release
        id: create-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view ${{ steps.get-version.outputs.version }} >/dev/null 2>&1; then
            echo "Release already exists"
            echo "release-created=false" >> $GITHUB_OUTPUT
          else
            gh release create ${{ steps.get-version.outputs.version }} \
              --title "Release ${{ steps.get-version.outputs.version }}" \
              --generate-notes
            echo "release-created=true" >> $GITHUB_OUTPUT
          fi

  publish-npm:
    needs: [create-tag-and-release]
    if: |
      always() && 
      (github.event_name == 'release' || 
       (github.event_name == 'workflow_dispatch' && needs.create-tag-and-release.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Update npm (trusted publishing requires >= 11.5.1)
        run: npm install -g npm@latest

      - run: npm ci

      - run: npm run build

      - run: npm publish --access public

  publish-github:
    needs: [create-tag-and-release]
    if: |
      always() && 
      (github.event_name == 'release' || 
       (github.event_name == 'workflow_dispatch' && needs.create-tag-and-release.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - run: npm ci

      - run: npm run build

      - name: Scope package name for GitHub Packages
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@${GITHUB_REPOSITORY_OWNER}/' + pkg.name;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
